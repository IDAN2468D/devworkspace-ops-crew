$kind: http-request
description: מפעיל את צוות הסוכנים, מפרסם אירוע ops.run.completed ל-Kafka, ומחזיר בריף + רשימת פעולות HITL ממתינות.
url: "{{gateway_url}}/api/v1/ops/run"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "prompt": "הכן לי בריף בוקר מהמיילים, הדרייב (כולל חיפוש SPEC ב-RAG ו-Elasticsearch) ו-GitHub, והצע פעולות נדרשות."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('הרצת צוות הסוכנים הצליחה', function () {
          pm.response.to.have.status(200);
          const data = pm.response.json();
          pm.expect(data).to.have.property('supervisor_output');
          if (data.pending_actions && data.pending_actions.length > 0) {
              pm.environment.set('action_id', data.pending_actions[0].action_id);
          }
      });
    language: text/javascript
order: 1000
