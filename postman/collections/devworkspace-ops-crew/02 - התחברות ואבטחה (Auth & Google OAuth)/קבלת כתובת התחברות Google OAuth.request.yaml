$kind: http-request
description: מחזיר auth_url לפתיחה בדפדפן עבור התחברות Google ושמירת טוקני MCP.
url: "{{gateway_url}}/api/v1/auth/google/login"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('התקבל קישור התחברות תקין', function () {
          pm.response.to.have.status(200);
          const data = pm.response.json();
          pm.expect(data).to.have.property('auth_url');
      });
    language: text/javascript
order: 1000
